genmuon_matcher:
  src: "utils.genmuon_functions.analyze_genmuon_matches"

genmuon_showerer:
  src: "utils.genmuon_functions.analyze_genmuon_showers"
  kwargs:
    method: 2 # 1: using offline segments, 2: using simhits, 3: using real showers

real_shower_builder:
  src: "utils.shower_functions.build_real_showers"
  kwargs:
    threshold: 8
    debug: False
    Filtersimhits: True
    include_sl2: False
    resultColName: "realshowers"

showers_builder:
  src: "utils.shower_functions.build_fwshowers"
  kwargs:
    threshold: [9, 9, 8, 8]
    debug: False
    name: "fwshowers"

shower_analyzer:
  src: "utils.shower_functions.analyze_fwshowers"
  kwargs:
    showers2use_name: "fwshowers"
    realshowers2use_name: "realshowers"

drop_fwshowers:
  src: "utils.shower_functions.drop_fwshowers"
  kwargs:
    showers2use_name: "fwshowers"

filter_matching:
  src: "filter_main.barrel_filter_analyzer"
  kwargs:
    only4true_showers: False
    shower_seg_version: 2
    cover_full_cells: False
    showers2use_name: "fwshowers"
    tps2use_name: "tps"

showers-classifier:
  src: "showers_classification.highpt_showers_identifier"
  kwargs:
    highpt_threshold: 200
    "showers2use_name": "fwshowers"